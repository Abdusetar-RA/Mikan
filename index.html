<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Orbit — for the two of you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Leaflet CSS for the shared live-location map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<style>
  .inline-del{ background:rgba(245,240,232,0.05); border:1px solid var(--line-2); border-radius:8px; color:var(--cream-dim); font-size:14px; padding:4px 8px; cursor:pointer; }
.inline-add{ display:flex; gap:8px; margin-top:4px; margin-bottom:24px; }
.inline-add input{ padding:10px 14px; font-size:14px; border-radius:12px; flex:1; background:var(--glass-bg); border:1px solid var(--glass-border); color:var(--cream); }
  :root{
    --ink:#1B1A2E;
    --ink-2:#211F38;
    --plum:#2C2848;
    --plum-2:#37315A;
    --cream:#F5F0E8;
    --cream-dim:#B9B2C9;
    --gold:#E3A857;
    --gold-2:#F0C382;
    --rose:#E8879C;
    --rose-2:#F2A6B8;
    --sage:#8FBC94;
    --sky:#7EC8E3;
    --line:rgba(245,240,232,0.10);
    --line-2:rgba(245,240,232,0.16);
    --glass-bg:linear-gradient(155deg, rgba(58,52,94,0.55), rgba(28,26,48,0.55));
    --glass-border:rgba(245,240,232,0.14);
    --glass-shadow:0 10px 28px rgba(8,7,18,0.4), inset 0 1px 0 rgba(255,255,255,0.07), inset 0 0 0 1px rgba(255,255,255,0.02);
    --glass-blur:blur(20px) saturate(160%);
    --ease-pop:cubic-bezier(.22,.9,.32,1.2);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(60% 45% at 12% 8%, rgba(232,135,156,0.20) 0%, transparent 60%),
      radial-gradient(55% 40% at 88% 14%, rgba(227,168,87,0.16) 0%, transparent 60%),
      radial-gradient(70% 55% at 50% 100%, rgba(126,200,227,0.10) 0%, transparent 60%),
      radial-gradient(120% 100% at 50% -10%, #2A2650 0%, #1B1A2E 55%, #16152A 100%);
    background-attachment:fixed;
    color:var(--cream);
    font-family:'Plus Jakarta Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app{ max-width:480px; margin:0 auto; min-height:100vh;
    padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
    display:flex; flex-direction:column; position:relative; }
  h1,h2,h3{font-family:'Fraunces', serif; font-weight:600; margin:0;}
  p{margin:0;}
  ::selection{background:var(--gold); color:var(--ink);}

  .ring-card, .routine-item, .composer, .feed-item, .settings-block, .profile-card,
  .deck-card, .qcard, .tod-card, .draw-wrap, .quiz-card, .gift-card, .jar-note,
  .letter-card, .capsule-card, .countdown-card{
    transition:transform .28s var(--ease-pop), box-shadow .28s ease, border-color .28s ease;
    will-change:transform;
  }
  .deck-card:hover, .letter-card:hover, .gift-card:hover, .jar-note:hover, .capsule-card:hover{
    transform:translateY(-3px); border-color:rgba(227,168,87,0.35);
    box-shadow:0 16px 34px rgba(8,7,18,0.45), 0 0 0 1px rgba(227,168,87,0.10), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .deck-card:active, .letter-card:active, .gift-card:active, .jar-note:active, .capsule-card:active{
    transform:translateY(-1px) scale(0.98);
  }
  .ring-card:hover{ transform:translateY(-3px); box-shadow:0 16px 34px rgba(8,7,18,0.45), inset 0 1px 0 rgba(255,255,255,0.08); }

  .btn, .nudge-btn, .icon-btn, .sync-fab, .activity-chip-btn, .chip-pick, .tab, .subtab, .swatch, .check, .cheer-chip{
    transition:transform .18s var(--ease-pop), box-shadow .22s ease, background .22s ease, border-color .22s ease, filter .22s ease;
  }
  .btn:active, .nudge-btn:active, .sync-fab:active, .activity-chip-btn:active, .chip-pick:active, .cheer-chip:active{
    transform:scale(0.95);
  }
  .btn-primary{
    background:linear-gradient(135deg, var(--gold-2), var(--gold) 55%, #D9954A);
    box-shadow:0 6px 20px rgba(227,168,87,0.35), 0 0 0 1px rgba(255,255,255,0.12) inset;
  }
  .btn-primary:hover:not(:disabled){ filter:brightness(1.08); box-shadow:0 8px 26px rgba(227,168,87,0.5), 0 0 0 1px rgba(255,255,255,0.16) inset; transform:translateY(-1px); }
  .btn-ghost{ background:rgba(245,240,232,0.04); backdrop-filter:blur(10px); }
  .btn-ghost:hover{ background:rgba(245,240,232,0.08); border-color:var(--line-2); }
  .sync-fab:hover{ box-shadow:0 0 0 4px rgba(227,168,87,0.14), 0 6px 16px rgba(227,168,87,0.25); filter:brightness(1.15); }

  .onboard{ flex:1; display:flex; flex-direction:column; justify-content:center; padding:32px 28px; gap:22px; }
  .onboard-mark{ font-family:'Fraunces', serif; font-size:15px; letter-spacing:0.16em; text-transform:uppercase; color:var(--gold); }
  .onboard h1{font-size:34px; line-height:1.15; letter-spacing:-0.01em;}
  .onboard-sub{color:var(--cream-dim); font-size:15px; line-height:1.5;}
  .field label{display:block; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:var(--cream-dim); margin-bottom:7px;}
  input[type=text], input[type=password], input[type=time], input[type=range], textarea, select{
    width:100%; background:var(--plum); border:1px solid var(--line-2); color:var(--cream);
    border-radius:12px; padding:12px 14px; font-family:inherit; font-size:15px; outline:none; }
  input[type=text]:focus, input[type=password]:focus, input[type=time]:focus, textarea:focus, select:focus{border-color:var(--gold);}
  .field{margin-bottom:14px;}
  .btn{ appearance:none; border:none; cursor:pointer; border-radius:14px; padding:14px 18px;
    font-family:'Plus Jakarta Sans', sans-serif; font-size:15px; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn-primary{background:linear-gradient(135deg, var(--gold), #D99A4A); color:#20160A;}
  .btn-primary:disabled{opacity:0.4; cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--cream-dim); border:1px solid var(--line-2);}
  .btn-block{width:100%;}
  .role-pick{display:flex; gap:10px; margin-top:6px;}
  .role-pick button{ flex:1; background:var(--plum); border:1px solid var(--line-2); color:var(--cream);
    border-radius:14px; padding:16px 10px; font-family:'Fraunces',serif; font-size:17px; cursor:pointer; }

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:16px 20px 4px;}
  .brand{font-family:'Fraunces',serif; font-size:14px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold);}
  .icon-btn{background:none; border:none; color:var(--cream-dim); cursor:pointer; padding:6px; font-size:18px; line-height:1;}

  .orbit-wrap{position:relative; height:172px; margin:6px 20px 4px;}
  .orbit-line{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:150px; height:2px;
    background:linear-gradient(90deg, transparent, var(--line-2) 20%, var(--gold) 50%, var(--line-2) 80%, transparent); opacity:0.6; }
  .orbit-pulse{ position:absolute; top:50%; left:50%; width:8px; height:8px; margin:-4px 0 0 -4px;
    border-radius:50%; background:var(--gold); animation:pulse 2.6s ease-out infinite; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(227,168,87,0.5);} 70%{box-shadow:0 0 0 16px rgba(227,168,87,0);} 100%{box-shadow:0 0 0 0 rgba(227,168,87,0);} }
  .planet{ position:absolute; top:50%; width:104px; text-align:center; animation:bob 5s ease-in-out infinite; }
  .planet.me{left:calc(50% - 154px); margin-top:-52px; animation-delay:0s;}
  .planet.them{left:calc(50% + 50px); margin-top:-52px; animation-delay:2.2s;}
  @keyframes bob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-7px);} }
  .planet-orb{ width:68px; height:68px; border-radius:50%; margin:0 auto 8px; cursor:pointer;
    background:radial-gradient(circle at 32% 28%, var(--plum-2), var(--plum));
    border:1px solid var(--line-2); box-shadow:0 6px 18px rgba(0,0,0,0.35); overflow:hidden; }
  .planet-orb:active{transform:scale(0.95);}
  .planet-orb svg{width:100%; height:100%; display:block;}
  .planet-name{font-size:12.5px; font-weight:600; color:var(--cream);}
  .planet-mood{font-size:11px; color:var(--cream-dim); margin-top:1px;}

  .tabs{display:flex; gap:6px; padding:10px 20px 14px; overflow-x:auto;}
  .tab{ flex:none; padding:8px 15px; border-radius:999px; font-size:13.5px; font-weight:600;
    background:rgba(245,240,232,0.05); backdrop-filter:blur(10px); color:var(--cream-dim); border:1px solid var(--line); cursor:pointer; white-space:nowrap; }
  .tab:hover{ background:rgba(245,240,232,0.09); color:var(--cream); }
  .tab.active{
    background:linear-gradient(120deg, var(--gold-2), var(--gold) 45%, var(--rose));
    color:#2A160A; border-color:transparent;
    box-shadow:0 4px 16px rgba(227,168,87,0.4), 0 0 0 1px rgba(255,255,255,0.15) inset;
  }
  .content{flex:1; padding:0 20px 100px; overflow-y:auto;}
  .section-title{font-size:19px; margin-bottom:2px;}
  .section-sub{color:var(--cream-dim); font-size:13px; margin-bottom:14px;}

  .rings-row{display:flex; gap:14px; margin-bottom:20px;}
  .ring-card{ flex:1; background:var(--glass-bg); border:1px solid var(--glass-border); box-shadow:var(--glass-shadow); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); border-radius:18px;
    padding:16px; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .ring-card .who{font-size:12.5px; font-weight:600; color:var(--cream-dim); margin-bottom:2px;}
  .ring-visual{ position:relative; width:76px; height:76px; }
  .ring-pct{font-family:'Fraunces',serif; font-size:20px; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); margin:0; line-height:1;}
  .streak-badge{font-size:11px; color:var(--gold); display:flex; align-items:center; gap:4px;}
  .ring-complete{animation:ringGlowPulse 2.2s ease-in-out infinite;}
  @keyframes ringGlowPulse{0%,100%{filter:drop-shadow(0 0 0 rgba(227,168,87,0));}50%{filter:drop-shadow(0 0 10px rgba(227,168,87,0.55));}}

  .sheet-backdrop{ position:fixed; inset:0; background:rgba(10,9,20,0.6); backdrop-filter:blur(2px);
    display:flex; align-items:flex-end; justify-content:center; z-index:50; animation:backdropFadeIn .25s ease; }
  @keyframes backdropFadeIn{ from{opacity:0;} to{opacity:1;} }
  .sheet{ width:100%; max-width:480px; background:var(--ink-2); border-top:1px solid var(--line-2);
    border-radius:22px 22px 0 0; padding:20px 20px calc(24px + env(safe-area-inset-bottom,0));
    animation:sheetPopIn .45s var(--ease-pop); transform-origin:bottom center; }
  @keyframes sheetPopIn{ 0%{ transform:translateY(46px) scale(0.95); opacity:0; } 60%{ transform:translateY(-5px) scale(1.015); opacity:1; } 100%{ transform:translateY(0) scale(1); opacity:1; } }
  .sheet-handle{width:36px; height:4px; border-radius:2px; background:var(--line-2); margin:0 auto 14px;}
  .face-stage{width:150px; height:150px; margin:4px auto 6px;}
  .face-rating{ text-align:center; font-family:'Fraunces',serif; font-size:15px; margin-bottom:2px; }
  .face-rating b{font-size:26px; color:var(--gold);}
  .face-label{text-align:center; color:var(--cream-dim); font-size:13px; margin-bottom:16px;}
  .rate-slider{-webkit-appearance:none; height:8px; border-radius:999px;
    background:linear-gradient(90deg, #6B6690, var(--rose) 45%, var(--gold) 100%); }
  .rate-slider::-webkit-slider-thumb{-webkit-appearance:none; width:26px; height:26px; border-radius:50%;
    background:var(--cream); border:3px solid var(--gold); cursor:pointer; margin-top:-9px;}
  .rate-slider::-moz-range-thumb{width:26px; height:26px; border-radius:50%; background:var(--cream); border:3px solid var(--gold); cursor:pointer;}
  .rate-ticks{display:flex; justify-content:space-between; padding:6px 2px 0; color:var(--cream-dim); font-size:10.5px;}

  .routine-item{ display:flex; align-items:center; gap:10px; background:var(--glass-bg); border:1px solid var(--glass-border); box-shadow:var(--glass-shadow); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
    border-radius:16px; padding:12px 14px; margin-bottom:10px; }
  .routine-icon{width:40px; height:40px; border-radius:12px; background:var(--plum); display:flex; align-items:center; justify-content:center; font-size:18px; flex:none;}
  .routine-mid{flex:1; min-width:0;}
  .routine-label{font-weight:600; font-size:14.5px;}
  .routine-time{font-size:12px; color:var(--cream-dim);}
  .check{ width:30px; height:30px; border-radius:99px; border:1.5px solid var(--line-2); flex:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:15px; color:transparent; }
  .check.mine.done{background:var(--sage); border-color:var(--sage); color:#123018;}
  .check.theirs.done{background:transparent; border-color:var(--rose); color:var(--rose); cursor:default;}
  .nudge-btn{ width:30px; height:30px; border-radius:9px; border:1.5px dashed var(--line-2); background:none; flex:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; color:var(--cream-dim); }
  .nudge-btn:active{transform:scale(0.9);}
  .nudge-btn.sent{border-style:solid; border-color:var(--gold); color:var(--gold);}

  .composer{background:var(--glass-bg); border:1px solid var(--glass-border); box-shadow:var(--glass-shadow); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); border-radius:16px; padding:12px; margin-bottom:18px;}
  .composer textarea{resize:none; min-height:52px; margin-bottom:10px;}
  .composer-row{display:flex; gap:8px; align-items:center;}
  .thumb-preview{position:relative; margin-bottom:10px;}
  .thumb-preview img{width:100%; border-radius:12px; display:block; max-height:180px; object-fit:cover;}
  .thumb-remove{position:absolute; top:8px; right:8px; background:rgba(10,9,20,0.7); color:var(--cream); border:none; border-radius:8px; width:26px; height:26px; cursor:pointer;}
  .file-btn{background:var(--plum); border:1px solid var(--line-2); color:var(--cream-dim); border-radius:10px; padding:9px 12px; cursor:pointer; font-size:13px; display:flex; align-items:center; gap:6px;}
  .cheer-quick{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
  .cheer-chip{background:var(--plum); border:1px solid var(--line-2); color:var(--cream); border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer;}

  .feed-item{background:var(--glass-bg); border:1px solid var(--glass-border); box-shadow:var(--glass-shadow); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); border-radius:16px; padding:14px; margin-bottom:12px;}
  .feed-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .feed-author{font-weight:600; font-size:13.5px;}
  .feed-time{font-size:11.5px; color:var(--cream-dim);}
  .feed-text{font-size:14px; line-height:1.5;}
  .feed-photo-wrap{position:relative; margin-top:10px; border-radius:12px; overflow:hidden; user-select:none; -webkit-user-select:none;}
  .feed-item img{width:100%; border-radius:12px; display:block;}
  .feed-photo-wrap img{margin-top:0; border-radius:12px;}
  .feed-item.cheer .feed-text{color:var(--rose); font-weight:600;}
  .feed-item.nudge .feed-text{color:var(--gold); font-weight:600;}
  .feed-item.celebrate{border-color:rgba(227,168,87,0.4);}
  .feed-item.celebrate .feed-text{color:var(--gold); font-weight:700;}
  .feed-hearts{margin-top:8px; font-size:12.5px; color:var(--rose); display:flex; align-items:center; gap:4px;}
  .heart-pop{ position:absolute; top:50%; left:50%; font-size:64px; transform:translate(-50%,-50%) scale(0.3); opacity:0;
    animation:heartPop .85s var(--ease-pop) forwards; pointer-events:none; filter:drop-shadow(0 4px 14px rgba(0,0,0,0.5)); }
  @keyframes heartPop{ 0%{ transform:translate(-50%,-50%) scale(0.3); opacity:0; } 30%{ transform:translate(-50%,-50%) scale(1.15); opacity:1; } 55%{ transform:translate(-50%,-50%) scale(0.95); opacity:1; } 100%{ transform:translate(-50%,-50%) scale(1.05); opacity:0; } }

  .stories-row{display:flex; gap:12px; overflow-x:auto; padding:2px 2px 14px; margin-bottom:4px;}
  .story-item{flex:none; display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer; width:62px;}
  .story-ring{width:58px; height:58px; border-radius:50%; padding:2.5px;
    background:linear-gradient(135deg, var(--gold-2), var(--rose) 55%, #B968D6);
    transition:transform .2s var(--ease-pop);}
  .story-item:active .story-ring{transform:scale(0.92);}
  .story-thumb{width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; border:2.5px solid var(--ink);}
  .story-label{font-size:10px; color:var(--cream-dim); text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:62px;}

  .story-viewer{ position:fixed; inset:0; z-index:600; background:#000; display:flex; flex-direction:column;
    animation:storyFadeIn .25s ease; }
  @keyframes storyFadeIn{ from{opacity:0;} to{opacity:1;} }
  .story-progress{display:flex; gap:4px; padding:10px 10px 0;}
  .story-progress-seg{flex:1; height:2.5px; border-radius:2px; background:rgba(255,255,255,0.25); overflow:hidden;}
  .story-progress-seg.seen{background:rgba(255,255,255,0.9);}
  .story-top{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; color:#fff;}
  .story-top span{font-size:13px; font-weight:600;}
  .story-time{color:rgba(255,255,255,0.6); font-weight:400 !important; font-size:12px;}
  .story-close{background:none; border:none; color:#fff; font-size:20px; cursor:pointer; padding:4px;}
  .story-img{flex:1; width:100%; object-fit:contain; min-height:0;}
  .story-caption{color:#fff; text-align:center; padding:12px 20px calc(20px + env(safe-area-inset-bottom,0)); font-size:14px;}
  .story-nav-left, .story-nav-right{ position:absolute; top:60px; bottom:60px; width:33%; cursor:pointer; }
  .story-nav-left{left:0;} .story-nav-right{right:0;}

  .empty{text-align:center; padding:40px 12px; color:var(--cream-dim);}
  .empty .e-emo{font-size:30px; margin-bottom:10px;}
  .empty .e-title{font-family:'Fraunces',serif; color:var(--cream); font-size:16px; margin-bottom:4px;}

  .settings-block{background:var(--glass-bg); border:1px solid var(--glass-border); box-shadow:var(--glass-shadow); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); border-radius:16px; padding:16px; margin-bottom:14px;}
  .settings-block h3{font-size:14.5px; margin-bottom:10px;}
  .settings-row{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-top:1px solid var(--line);}
  .settings-row:first-child{border-top:none;}
  .switch{width:42px; height:24px; border-radius:999px; background:var(--plum); border:1px solid var(--line-2); position:relative; cursor:pointer; flex:none;}
  .switch.on{background:var(--gold); border-color:var(--gold);}
  .switch::after{content:''; position:absolute; width:18px; height:18px; border-radius:50%; background:var(--cream); top:2px; left:2px; transition:left .15s;}
  .switch.on::after{left:20px; background:#20160A;}
  .add-routine{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  .add-routine .row2{display:flex; gap:8px;}
  .remove-x{background:none; border:none; color:var(--cream-dim); font-size:16px; cursor:pointer; padding:4px 6px;}
  .danger{color:var(--rose);}
  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); max-width:88%;
    background:var(--gold); color:#20160A; font-weight:600; font-size:13.5px; text-align:center;
    padding:10px 18px; border-radius:999px; z-index:80; box-shadow:0 8px 20px rgba(0,0,0,0.35); }
  .local-mode-banner{ background:linear-gradient(120deg, rgba(232,135,156,0.22), rgba(227,168,87,0.16));
    border-bottom:1px solid var(--glass-border); padding:10px 16px; font-size:12px; line-height:1.4; color:var(--cream);
    display:flex; align-items:center; gap:10px; }
  .local-mode-banner b{color:var(--rose);}
  .local-mode-banner button{ margin-left:auto; flex:none; background:none; border:none; color:var(--cream-dim); font-size:16px; cursor:pointer; padding:2px 4px; }
  .loading-dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--gold); animation:blink 1.2s infinite;}
  @keyframes blink{0%,100%{opacity:0.2;}50%{opacity:1;}}

  .floating-layer{ position:fixed; inset:0; max-width:480px; margin:0 auto; pointer-events:none; z-index:400; }
  .instant-fab{ position:absolute; right:18px; bottom:calc(22px + env(safe-area-inset-bottom,0)); pointer-events:auto;
    width:58px; height:58px; border-radius:50%; border:1px solid var(--glass-border);

  function mulberry32(seedStr){
    let h = 1779033703 ^ seedStr.length;
    for(let i=0;i<seedStr.length;i++){
      h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return function(){
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      h ^= h >>> 16;
      return (h >>> 0) / 4294967296;
    };
  }

  function getQuestionAt(deck, qi){
    if(qi < deck.questions.length) return deck.questions[qi];
    const bank = PROCEDURAL_BANK[deck.id];
    if(!bank) return deck.questions[qi % deck.questions.length]; // custom decks: just cycle
    const rng = mulberry32(deck.id+':'+qi);

    return `${pickFrom(rng, bank.openers)} ${pickFrom(rng, bank.topics)}?`;
  }

  let authUser = null;

  function renderLogin(opts){
    opts = opts || {};
    app.innerHTML = `
    <div class="onboard">
      <div class="onboard-mark">🔒 Private Space</div>
      <h1>Welcome back.</h1>
      <p class="onboard-sub">Sign in with your account to access Orbit.</p>
      <div class="field"><label>Email</label><input type="email" id="login-email" placeholder="you@example.com" autocomplete="username"></div>
      <div class="field"><label>Password</label><input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"></div>
      <button class="btn btn-primary btn-block" id="login-btn">Log In</button>
      <button class="btn btn-ghost btn-block" id="signup-btn" style="margin-top:8px;">First time — create my account</button>
      <p class="onboard-sub" id="login-err" style="color:var(--rose); display:${opts.error ? 'block':'none'}; margin-top:10px;">${opts.error||''}</p>
    </div>`;

    const emailEl = document.getElementById('login-email');
    const passEl = document.getElementById('login-password');
    const errEl = document.getElementById('login-err');
    const showErr = (msg)=>{ errEl.textContent = msg; errEl.style.display = 'block'; };

    document.getElementById('login-btn').onclick = async () => {
      const email = emailEl.value.trim().toLowerCase();
      const pass = passEl.value;
      if(!email || !pass){ showErr('Enter your email and password.'); return; }
      if(!ALLOWED_USERS[email]){ showErr('This email is not authorized for this Orbit.'); return; }
      try{
        await setPersistence(auth, browserLocalPersistence);
        await signInWithEmailAndPassword(auth, email, pass);
        // onAuthStateChanged picks it up from here
      }catch(e){
        showErr(e.code==='auth/invalid-credential' || e.code==='auth/wrong-password' ? 'Wrong email or password.' : (e.message||'Could not sign in.'));
      }
    };

    document.getElementById('signup-btn').onclick = async () => {
      const email = emailEl.value.trim().toLowerCase();
      const pass = passEl.value;
      if(!email || !pass){ showErr('Enter your email and a password (6+ characters).'); return; }
      if(!ALLOWED_USERS[email]){ showErr('This email is not authorized for this Orbit. Only the two of you can create an account here.'); return; }
      try{
        await setPersistence(auth, browserLocalPersistence);
        await createUserWithEmailAndPassword(auth, email, pass);
      }catch(e){
        showErr(e.code==='auth/email-already-in-use' ? 'That account already exists — use Log In instead.' : (e.message||'Could not create account.'));
      }
    };
  }

  async function boot(){
    if(!firebaseReady || !auth){
      app.innerHTML = `<div class="onboard"><div class="onboard-mark">⚠️</div><h1>Can't reach Firebase.</h1><p class="onboard-sub">Check your connection and reload.</p></div>`;
      return;
    }
    onAuthStateChanged(auth, async (user) => {
      if(!user){ authUser = null; renderLogin(); return; }
      const profile = ALLOWED_USERS[(user.email||'').toLowerCase()];
      if(!profile){
        // Someone got an account but isn't one of the two allowed people — kick them out.
        await fbSignOut(auth);
        renderLogin({error: 'This account is not authorized for this Orbit.'});
        return;
      }
      authUser = user;
      await afterAuth(profile);
    });
  }

  async function afterAuth(profile){
    state.identity = { role: profile.role, name: profile.name, email: authUser.email, uid: authUser.uid };
    let coupleRaw = await sGet('couple-config', true);
    state.couple = getJSON(coupleRaw, null);
    if(!state.couple){
      // First person to ever log in seeds the shared couple config from ALLOWED_USERS.
      const names = Object.values(ALLOWED_USERS);
      const nameA = (names.find(n=>n.role==='A')||{}).name || 'A';
      const nameB = (names.find(n=>n.role==='B')||{}).name || 'B';
      state.couple = {nameA, nameB, createdAt: Date.now()};
      await sSet('couple-config', JSON.stringify(state.couple), true);
      await sSet('routines-config', JSON.stringify(DEFAULT_ROUTINES), true);
    }
    const seenRaw = await sGet('care-seen:'+myRole(), true);
    state.lastSeenCareTs = parseInt(getJSON(seenRaw, '0'), 10) || 0;
    if(!state.lastSeenCareTs){
      const existing = getJSON(await sGet('care:'+myRole(), true), null);
      if(existing) state.lastSeenCareTs = existing.ts;

  function triggerCareBurst(){
    const layer = document.createElement('div');
    layer.className = 'care-burst-layer';
    const shapes = [
      `<svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.9-10.2-9.6C-0.4 7.6 2 3.5 6 3.5c2.2 0 3.8 1.2 6 3.4 2.2-2.2 3.8-3.4 6-3.4 4 0 6.4 4.1 4.2 7.9C19.5 16.1 12 21 12 21z" fill="currentColor"/></svg>`,
      `<svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 0l2.4 8.6L23 11l-8.6 2.4L12 22l-2.4-8.6L1 11l8.6-2.4z" fill="currentColor"/></svg>`,
    ];
    const colors = ['#E8879C','#E3A857','#B968D6','#F2A6B8'];
    for(let i=0;i<26;i++){
      const p = document.createElement('div');
      p.className = 'care-particle';
      const left = Math.random()*100;
      const drift = (Math.random()*160-80)+'px';
      const rot = (Math.random()*360-180)+'deg';
      const dur = (2+Math.random()*1.6).toFixed(2)+'s';
      const delay = (Math.random()*0.6).toFixed(2)+'s';
      const size = 0.7+Math.random()*0.9;
      p.style.left = left+'%';
      p.style.setProperty('--drift', drift);
      p.style.setProperty('--rot', rot);
      p.style.animationDuration = dur;
      p.style.animationDelay = delay;
      p.style.color = colors[Math.floor(Math.random()*colors.length)];
      p.style.transform = `scale(${size.toFixed(2)})`;
      p.innerHTML = shapes[Math.floor(Math.random()*shapes.length)];
      layer.appendChild(p);
    }
    document.body.appendChild(layer);
    setTimeout(()=>{ if(layer.parentNode) layer.parentNode.removeChild(layer); }, 4200);
  }

  function auraOrbSvg(score, size, opts){
    opts = opts || {};
    const id = 'aoid'+Math.random().toString(36).slice(2,8);
    if(score==null){
      return `<svg width="${size}" height="${size}" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="40" fill="rgba(245,240,232,0.05)" stroke="rgba(245,240,232,0.18)" stroke-width="1.5" stroke-dasharray="4 5"/>
        <text x="50" y="56" text-anchor="middle" font-size="22" fill="rgba(245,240,232,0.35)" font-family="sans-serif">?</text>
      </svg>`;
    }
    const tier = energyTier(score);
    const c = energyTierColors(score);
    let extras = '';
    if(tier==='low'){
      extras = Array.from({length:5}, (_,i)=>{
        const x = 20+Math.random()*60, y = 20+Math.random()*60, r = 1.4+Math.random()*1.8;
        return `<circle class="orb-particle" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${c.accent}" opacity="0.55" style="animation-delay:${(i*0.5).toFixed(1)}s;"/>`;
      }).join('');
    } else if(tier==='radiant'){
      extras = Array.from({length:6}, (_,i)=>{
        const a = (i/6)*2*Math.PI, r = 34+ (i%2)*4;
        const x = 50+r*Math.cos(a), y = 50+r*Math.sin(a);
        return `<g class="orb-sparkle" style="transform-origin:${x.toFixed(1)}px ${y.toFixed(1)}px;">
          <path transform="translate(${x.toFixed(1)-5},${y.toFixed(1)-5})" d="M5 0l1.3 3.7L10 5 6.3 6.3 5 10 3.7 6.3 0 5l3.7-1.3z" fill="${c.accent}"/>
        </g>`;
      }).join('');
    }
    const bodyClass = tier==='balanced' ? 'orb-breathe' : '';
    return `<svg width="${size}" height="${size}" viewBox="0 0 100 100">
      <defs>
        <radialGradient id="${id}" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="${c.accent}"/>
          <stop offset="55%" stop-color="${c.a}"/>
          <stop offset="100%" stop-color="${c.b}"/>
        </radialGradient>
      </defs>
      <circle class="${bodyClass}" cx="50" cy="50" r="38" fill="url(#${id})" style="filter:drop-shadow(0 0 10px ${c.a}99);"/>
      <circle cx="38" cy="36" r="10" fill="rgba(255,255,255,0.18)"/>
      ${extras}
    </svg>`;
  }

  function sparklineSvg(entries, color, w, h){
    if(!entries || entries.length<2){
      return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><line x1="4" y1="${h/2}" x2="${w-4}" y2="${h/2}" stroke="rgba(245,240,232,0.15)" stroke-width="1.5" stroke-dasharray="3 4"/></svg>`;
    }
    const n = entries.length;
    const pad = 4;
    const pts = entries.map((e,i)=>{
      const x = pad + (i/(n-1))*(w-pad*2);
      const y = pad + (1-(e.score-1)/9)*(h-pad*2);
      return [x,y];
    });
    const line = pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    const area = `${pad.toFixed(1)},${(h-pad).toFixed(1)} ${line} ${(w-pad).toFixed(1)},${(h-pad).toFixed(1)}`;
    const last = pts[pts.length-1];
    const id = 'spk'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.45"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient></defs>
      <polygon points="${area}" fill="url(#${id})"/>
      <polyline points="${line}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.6" fill="${color}" style="filter:drop-shadow(0 0 4px ${color});"/>
    </svg>`;
  }

  function qotdPickForToday(){
    const d = new Date(today());
    const dayNum = Math.floor(d.getTime()/86400000);
    const pool = [];
    DECKS.forEach(deck=>{ deck.questions.forEach((q,i)=>{ pool.push({catId:deck.id, qIndex:i, question:q, emo:deck.emo, catName:deck.name}); }); });
    return pool[dayNum % pool.length];
  }

  function handleInstantPhotoPick(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 640;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        state.instantPendingPhoto = canvas.toDataURL('image/jpeg', 0.6);
        renderApp();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  async function sendInstantPhoto(){
    if(!state.instantPendingPhoto) return;
    const item = {id:uid(), from:myRole(), dataUrl:state.instantPendingPhoto, status:'unopened', ts:Date.now()};
    await sSet('instant:'+otherRole(), JSON.stringify(item), true);
    state.instantSent = item;
    state.instantPendingPhoto = null;
    showToast('Instant photo sent ⚡');
    renderApp();
  }

  let weatherFetching = {A:false, B:false};
  async function refreshWeather(){
    for(const role of ['A','B']){
      const p = state.profile[role];
      if(!p || p.lat==null || p.lon==null) continue;
      const cached = state.weather[role];
      if(cached && Date.now()-cached.fetchedAt < 15*60*1000) continue;
      if(weatherFetching[role]) continue;
      weatherFetching[role] = true;
      try{
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&current=temperature_2m,weather_code&timezone=auto`);
        const data = await res.json();
        if(data && data.current){
          state.weather[role] = {temp: Math.round(data.current.temperature_2m), code: data.current.weather_code, fetchedAt: Date.now()};
          renderApp();
        }
      }catch(e){}
      weatherFetching[role] = false;
    }
  }

  async function computeStreaks(){
    for(const role of ['A','B']){
      let streak = 0;
      let d = new Date(); d.setDate(d.getDate()-1);
      for(let i=0;i<60;i++){
        const raw = await sGet('routine-log:'+fmtDate(d), true);
        const log = getJSON(raw, null);
        if(!log) break;
        const done = log[role] || {};
        const total = state.routines.length;
        const doneCount = state.routines.filter(r=>done[r.id]).length;
        if(total>0 && doneCount===total){ streak++; d.setDate(d.getDate()-1); }
        else break;
      }
      state.streaks[role] = streak;
    }
  }

  async function pollTick(){

    const newFromPartner = state.feed.filter(f=>!prevIds.has(f.id) && f.role===otherRole());
    for(const item of newFromPartner){
      announce(feedToastText(item));

    const nowActivity = activityOf(otherRole());

  function clockFaceSvg(tz, accent, size, dim){
    let hh=0, mm=0;
    if(tz && !dim){
      try{
        const parts = new Intl.DateTimeFormat('en-US',{timeZone:tz, hour12:false, hour:'2-digit', minute:'2-digit'}).formatToParts(new Date());
        const get = t=>{ const f = parts.find(p=>p.type===t); return f ? parseInt(f.value,10) : 0; };
        hh = get('hour')%12; mm = get('minute');
      }catch(e){ dim = true; }
    } else dim = true;
    const c = size/2;
    const hourAngle = (hh*30) + (mm*0.5);
    const minAngle = mm*6;
    const hourLen = size*0.24, minLen = size*0.34;
    const hx = (c + hourLen*Math.sin(hourAngle*Math.PI/180)).toFixed(1);
    const hy = (c - hourLen*Math.cos(hourAngle*Math.PI/180)).toFixed(1);
    const mx = (c + minLen*Math.sin(minAngle*Math.PI/180)).toFixed(1);
    const my = (c - minLen*Math.cos(minAngle*Math.PI/180)).toFixed(1);
    const tickColor = dim ? 'rgba(245,240,232,0.14)' : 'rgba(245,240,232,0.38)';
    const ticks = Array.from({length:12},(_,i)=>{
      const a = i*30*Math.PI/180;
      const r1 = size*0.43, r2 = size*0.36;
      const x1=(c+r1*Math.sin(a)).toFixed(1), y1=(c-r1*Math.cos(a)).toFixed(1);
      const x2=(c+r2*Math.sin(a)).toFixed(1), y2=(c-r2*Math.cos(a)).toFixed(1);
      return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${tickColor}" stroke-width="${i%3===0?2:1}"/>`;
    }).join('');
    const ringColor = dim ? 'rgba(245,240,232,0.14)' : accent;
    const ringGlow = dim ? '' : `filter:drop-shadow(0 0 7px ${accent});`;
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="clock-face-svg">
      <circle cx="${c}" cy="${c}" r="${(size*0.46).toFixed(1)}" fill="rgba(18,16,32,0.55)" stroke="${ringColor}" stroke-width="1.6" style="${ringGlow}"/>
      ${ticks}
      <line x1="${c}" y1="${c}" x2="${hx}" y2="${hy}" stroke="${dim?'rgba(245,240,232,0.28)':'var(--cream)'}" stroke-width="3" stroke-linecap="round"/>
      <line x1="${c}" y1="${c}" x2="${mx}" y2="${my}" stroke="${dim?'rgba(245,240,232,0.2)':accent}" stroke-width="2" stroke-linecap="round"/>
      <circle cx="${c}" cy="${c}" r="2.4" fill="${dim?'rgba(245,240,232,0.3)':accent}"/>
    </svg>`;
  }

  function pct(role){
    const total = state.routines.length;

  function ringSvg(percent, color){
    const r=30, c=2*Math.PI*r;
    const off = c - (percent/100)*c;
    const full = percent>=100;
    return `<svg width="76" height="76" viewBox="0 0 76 76" class="${full?'ring-complete':''}">
      <circle cx="38" cy="38" r="${r}" fill="none" stroke="var(--line-2)" stroke-width="7"/>
      <circle cx="38" cy="38" r="${r}" fill="none" stroke="${color}" stroke-width="7"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 38 38)"
        style="filter:drop-shadow(0 0 5px ${color}) drop-shadow(0 0 10px ${color}88); transition:stroke-dashoffset .6s var(--ease-pop);"/>
    </svg>`;
  }

  function todayHtml(){
    const sorted = state.routines.slice().sort((a,b)=> (a.time||'').localeCompare(b.time||''));
    const rows = sorted.map(r=>{
      const mineDone = !!state.logToday[myRole()][r.id];
      const theirsDone = !!state.logToday[otherRole()][r.id];
      const nudgeKey = today()+':'+r.id;
      const alreadyNudged = !!state.nudgedToday[nudgeKey];
      const rightControl = theirsDone
        ? `<div class="check theirs done">✓</div>`
        : `<button class="nudge-btn ${alreadyNudged?'sent':''}" data-nudge="${r.id}" data-label="${escapeHtml(r.label)}" title="Nudge ${escapeHtml(nameFor(otherRole()))}">${alreadyNudged?'✓':'👋'}</button>`;
      return `
      <div class="routine-item">
        <div class="routine-icon">${r.icon}</div>
        <div class="routine-mid">
          <div class="routine-label">${escapeHtml(r.label)}</div>
          <div class="routine-time">${r.time || ''} · ${nameFor(otherRole())} ${theirsDone?'done':'not yet'}</div>
        </div>
        ${rightControl}
        <div class="check mine ${mineDone?'done':''}" data-id="${r.id}">${mineDone?'✓':''}</div>
      </div>`;
    }).join('');

    return `
      ${countdownHtml()}
      ${qotdBannerHtml()}
      <div class="rings-row">
        <div class="ring-card">

  function tttWinner(board){
    const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for(const [a,b,c] of lines){ if(board[a] && board[a]===board[b] && board[a]===board[c]) return board[a]==='X'?'A':'B'; }
    if(board.every(v=>v)) return 'draw';
    return null;
  }
  async function tttMove(i){
    const g = state.games.ttt || {board:Array(9).fill(null), turn:'A', winner:null};
    if(g.winner || g.board[i] || g.turn!==myRole()) return;
    const mark = myRole()==='A' ? 'X' : 'O';
    const board = g.board.slice(); board[i] = mark;
    const winner = tttWinner(board);
    const next = {board, turn: otherRole(), winner};
    await sSet('game:ttt', JSON.stringify(next), true);
    state.games.ttt = next;
    renderApp();
  }
  function c4Winner(board){
    const get = (r,c)=> (r<0||r>5||c<0||c>6) ? null : board[r*7+c];
    const dirs = [[0,1],[1,0],[1,1],[1,-1]];
    for(let r=0;r<6;r++) for(let c=0;c<7;c++){
      const v = get(r,c); if(!v) continue;
      for(const [dr,dc] of dirs){
        if(get(r+dr,c+dc)===v && get(r+2*dr,c+2*dc)===v && get(r+3*dr,c+3*dc)===v) return v;
      }
    }
    if(board.every(v=>v)) return 'draw';
    return null;
  }
  async function c4Move(col){
    const g = state.games.c4 || {board:Array(42).fill(null), turn:'A', winner:null};
    if(g.winner || g.turn!==myRole()) return;
    const board = g.board.slice();
    let row = -1;
    for(let r=5;r>=0;r--){ if(!board[r*7+col]){ row=r; break; } }
    if(row<0) return;
    board[row*7+col] = myRole();
    const winner = c4Winner(board);
    const next = {board, turn: otherRole(), winner};
    await sSet('game:c4', JSON.stringify(next), true);
    state.games.c4 = next;
    renderApp();
  }

  function initDrawCanvas(){

    if(!canvas) return;
    drawCtx = canvas.getContext('2d');
    drawCtx.fillStyle = '#F5F0E8'; drawCtx.fillRect(0,0,canvas.width,canvas.height);
    if(state.canvas && state.canvas.dataUrl){
      const img = new Image();
      img.onload = ()=>{ drawCtx.drawImage(img,0,0,canvas.width,canvas.height); };
      img.src = state.canvas.dataUrl;
    }
    drawCtx.lineCap = 'round'; drawCtx.lineWidth = 5; drawCtx.strokeStyle = drawColor;
    function pos(e){
      const r = canvas.getBoundingClientRect();
      const p = e.touches ? e.touches[0] : e;
      return {x:(p.clientX-r.left)*(canvas.width/r.width), y:(p.clientY-r.top)*(canvas.height/r.height)};
    }
    function start(e){ drawing=true; const p=pos(e); drawCtx.beginPath(); drawCtx.moveTo(p.x,p.y); e.preventDefault(); }
    function move(e){ if(!drawing) return; const p=pos(e); drawCtx.lineTo(p.x,p.y); drawCtx.stroke(); drawDirty=true; e.preventDefault(); }
    async function end(){ if(!drawing) return; drawing=false; if(drawDirty) await saveCanvas(); }
    canvas.onmousedown=start; canvas.onmousemove=move; window.addEventListener('mouseup', end);
    canvas.ontouchstart=start; canvas.ontouchmove=move; canvas.ontouchend=end;
  }

        <div id="cap-rec-status" style="color:var(--cream-dim); font-size:12.5px; margin-top:8px;">Tap to start recording</div>
      </div>
      <div id="cap-preview"></div>
      <div class="field"><label>Unlocks on</label><input type="text" id="cap-date" placeholder="YYYY-MM-DD"></div>
      <button class="btn btn-primary btn-block" id="cap-send" disabled>Lock &amp; send</button></div>`;
    document.body.appendChild(backdrop);
    backdrop.onclick = (e)=>{ if(e.target===backdrop) document.body.removeChild(backdrop); };
    let mediaRecorder=null, chunks=[], recordedBlob=null, autoStopTimer=null;
    const recBtn = backdrop.querySelector('#cap-rec-btn');
    const statusEl = backdrop.querySelector('#cap-rec-status');
    recBtn.onclick = async ()=>{
      if(!mediaRecorder || mediaRecorder.state==='inactive'){
        try{
          const stream = await navigator.mediaDevices.getUserMedia({audio:true});
          chunks = [];
          mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.ondataavailable = e=>chunks.push(e.data);
          mediaRecorder.onstop = ()=>{
            recordedBlob = new Blob(chunks, {type:'audio/webm'});
            const previewUrl = URL.createObjectURL(recordedBlob);
            backdrop.querySelector('#cap-preview').innerHTML = `<audio controls src="${previewUrl}" style="width:100%; margin-bottom:10px;"></audio>`;
            backdrop.querySelector('#cap-send').disabled = false;
            stream.getTracks().forEach(t=>t.stop());
          };
          mediaRecorder.start();
          statusEl.innerHTML = '<span class="rec-dot" style="display:inline-block;"></span> Recording…';
          autoStopTimer = setTimeout(()=>{ if(mediaRecorder && mediaRecorder.state==='recording') mediaRecorder.stop(); }, 90000);
        }catch(e){ statusEl.textContent = 'Mic access denied.'; }
      } else {
        clearTimeout(autoStopTimer);
        mediaRecorder.stop();
        statusEl.textContent = 'Recorded.';
      }
    };
    backdrop.querySelector('#cap-send').onclick = async ()=>{
      const dStr = document.getElementById('cap-date').value.trim();
      const target = new Date(`${dStr}T00:00:00`);
      if(!dStr || isNaN(target.getTime()) || !recordedBlob) return;
      const sendBtn = backdrop.querySelector('#cap-send');
      sendBtn.disabled = true; sendBtn.textContent = 'Uploading…';
      const audioUrl = await uploadMediaToStorage(recordedBlob, 'capsules', 'webm');
      const c = {id:uid(), from:myRole(), to:otherRole(), audio:audioUrl, unlockAt:target.getTime(), opened:false, ts:Date.now()};
      await sSet('capsule:'+c.id, JSON.stringify(c), true);
      const idxRaw = await sGet('capsule-index', true);
      const ids = getJSON(idxRaw, []); ids.unshift(c.id);
      await sSet('capsule-index', JSON.stringify(ids), true);
      state.capsules.unshift(c);
      document.body.removeChild(backdrop);
      showToast('Capsule locked 🎙️ — stored for good');
      renderApp();
    };
  }
